[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "HDV and Hyperbolic space primitives for memory systems"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
hypothesis = [
    "scipy>=1.10.0",
    "pingouin>=0.5.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.10.0",
    "pingouin>=0.5.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]
